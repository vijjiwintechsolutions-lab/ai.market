<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – AI Market</title>

<body class="auth-page">
<noscript>
  <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N4Z93Z4T"
          height="0" width="0" style="display:none;visibility:hidden"></iframe>
</noscript>

<section class="auth-container">
  <div class="auth-card">
    <h1>AI Market</h1>
    <p class="auth-subtitle">Sign in to continue</p>

    <form>
      <input type="email" id="email" placeholder="Email address" required />
      <input type="password" id="password" placeholder="Password" required />
      <button id="emailLoginBtn" class="btn-primary" type="submit">Login</button>
    </form>

    <p class="auth-small">
      New here?
      <a href="signup.html">Create an account</a>
    </p>

    <div class="auth-divider"><span>OR</span></div>

    <button id="googleLogin" class="btn-secondary full-btn">
      Continue with Google
    </button>
    <button id="githubLogin" class="btn-secondary full-btn">
      Continue with GitHub
    </button>

    <p id="authMessage" class="auth-message"></p>
  </div>
</section>

</body>
</html>
