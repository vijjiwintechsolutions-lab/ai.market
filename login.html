<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – AI Market</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.png" />
</head>
<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <h1>AI Market</h1>
      <p class="login-subtitle">Optional sign-in (not required to browse or buy)</p>

      <form class="login-form" onsubmit="return false;">
        <label>Email address</label>
        <input type="email" placeholder="you@example.com" disabled />

        <label>Password</label>
        <input type="password" placeholder="••••••••" disabled />

        <button type="button" class="btn-primary full-btn" disabled>
          Login (coming soon)
        </button>
      </form>

      <div class="login-divider">OR</div>

      <button type="button" class="btn-outline full-btn small" disabled>
        Continue with Google (coming soon)
      </button>
      <button type="button" class="btn-outline full-btn small" disabled style="margin-top:6px;">
        Continue with GitHub (coming soon)
      </button>

      <p class="small center" style="margin-top: 16px;">
        Right now you can use AI Market without login.  
        <a href="pricing.html">Go to Pricing</a>
      </p>
    </div>
  </div>
</body>
</html>
