<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login — AI Market</title>

  <link rel="stylesheet" href="style.css">
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
</head>

<body class="auth-page">

<div class="auth-container">
  
  <h2>Sign In to AI Market</h2>

  <!-- Email Login -->
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button id="emailLoginBtn">Login</button>

  <p>New user? <a href="signup.html">Create account</a></p>

  <hr>

  <!-- Google Login -->
  <button id="googleLoginBtn" class="social-btn google">
    Continue with Google
  </button>

  <!-- GitHub Login -->
  <button id="githubLoginBtn" class="social-btn github">
    Continue with GitHub
  </button>

</div>

</body>
</html>
